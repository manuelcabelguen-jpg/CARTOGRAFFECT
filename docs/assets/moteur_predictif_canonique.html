<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moteur Prédictif Canonique — CARTOGRAFFECT (v3.0)</title>
  <style>
    :root {
      --font-sans: "Segoe UI", "Inter", system-ui, -apple-system, Arial, sans-serif;
      --font-mono: "Consolas", "JetBrains Mono", "Courier New", monospace;
    }

    /* THÈME 1 : ARTICLE ACADÉMIQUE (FOND CLAIR) */
    body.theme-article {
      --bg-page: #f1f5f9;
      --bg-svg: #ffffff;
      --box-fill: #f8fafc;
      --box-inner-fill: #eef2f7;
      --box-stroke: #334155;
      --box-subj-stroke: #1e3a5f;
      --box-perc-stroke: #6d28d9;
      --box-att-stroke: #0f766e;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-accent: #0f766e;
      --corps-fill: #ffffff;
      --corps-stroke: #475569;
      --dot-fill: #0f172a;
      --dot-stroke: #ffffff;
      --halo-fill: #ccfbf1;
      --halo-stroke: #0f766e;
      --ray-stroke: #475569;
      --pill-ac-fill: #1e293b;
      --pill-ac-text: #ffffff;
      --pill-ant-fill: #ccfbf1;
      --pill-ant-stroke: #0f766e;
      --pill-ant-text: #115e59;
      --pill-surp-fill: #fef08a;
      --pill-surp-stroke: #ca8a04;
      --pill-surp-text: #713f12;
      --a0: #56b4e9;
      --am: #0072b2;
      --ap: #08306b;
      --c0: #e69f00;
      --cm: #b91c80;
      --cp: #cc0c00;
      --macro-asc: #dc2626;
      --macro-desc: #0f766e;
      --macro-aff: #6d28d9;
      --btn-bg: #1e293b;
      --btn-text: #ffffff;
    }

    /* THÈME 2 : SITE WEB CARTOGRAFFECT (FOND SOMBRE) */
    body.theme-web {
      --bg-page: #050811;
      --bg-svg: #080d1a;
      --box-fill: #0e1628;
      --box-inner-fill: #132038;
      --box-stroke: #475569;
      --box-subj-stroke: #38bdf8;
      --box-perc-stroke: #c084fc;
      --box-att-stroke: #34d399;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-accent: #34d399;
      --corps-fill: #111827;
      --corps-stroke: #64748b;
      --dot-fill: #f8fafc;
      --dot-stroke: #080d1a;
      --halo-fill: #064e3b;
      --halo-stroke: #34d399;
      --ray-stroke: #94a3b8;
      --pill-ac-fill: #1e293b;
      --pill-ac-text: #e2e8f0;
      --pill-ant-fill: #064e3b;
      --pill-ant-stroke: #34d399;
      --pill-ant-text: #a7f3d0;
      --pill-surp-fill: #451a03;
      --pill-surp-stroke: #f59e0b;
      --pill-surp-text: #fde68a;
      --a0: #7dd3fc;
      --am: #38bdf8;
      --ap: #2563eb;
      --c0: #facc15;
      --cm: #e879f9;
      --cp: #f43f5e;
      --macro-asc: #f87171;
      --macro-desc: #34d399;
      --macro-aff: #c084fc;
      --btn-bg: #1e293b;
      --btn-text: #f8fafc;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: background 0.25s ease;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .toolbar button {
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid var(--box-stroke);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.9; }

    .diagram-frame {
      width: 100%;
      max-width: 1360px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--box-stroke);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      background: var(--bg-svg);
    }

    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body class="theme-article">

  <div class="toolbar">
    <button onclick="setTheme('theme-article')">Thème Article (Fond clair)</button>
    <button onclick="setTheme('theme-web')">Thème Site Web (Fond sombre)</button>
    <button onclick="exportSVG()">Exporter le SVG vectoriel</button>
  </div>

  <div class="diagram-frame">
    <svg id="moteur-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1085">
      <defs>
        <!-- Pointes profilées (stealth arrowheads) pour les 3 macro-voies -->
        <marker id="arr-asc" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto">
          <path d="M 1,1.5 L 13,7 L 1,12.5 L 4.2,7 Z" fill="var(--macro-asc)" />
        </marker>
        <marker id="arr-desc" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto">
          <path d="M 1,1.5 L 13,7 L 1,12.5 L 4.2,7 Z" fill="var(--macro-desc)" />
        </marker>
        <marker id="arr-aff" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto">
          <path d="M 1,1.5 L 13,7 L 1,12.5 L 4.2,7 Z" fill="var(--macro-aff)" />
        </marker>

        <!-- Masque interne pour prolonger les 9 rayons en opacité atténuée dans l'Interface Attentionnelle -->
        <clipPath id="clip-att-box">
          <rect x="65" y="555" width="445" height="316" rx="10" />
        </clipPath>

        <style>
          .t-title     { font-family: var(--font-sans); font-weight: 700; font-size: 13px; fill: var(--text-main); letter-spacing: 0.3px; }
          .t-sub       { font-family: var(--font-sans); font-weight: 600; font-size: 11px; fill: var(--text-muted); }
          .t-hidden    { font-family: var(--font-sans); font-weight: 700; font-size: 13px; fill: var(--text-main); }
          .t-meta      { font-family: var(--font-sans); font-weight: 500; font-size: 10.5px; fill: var(--text-muted); }
          .t-micro     { font-family: var(--font-sans); font-weight: 600; font-size: 9.5px; fill: var(--text-muted); }
          .t-accent    { font-family: var(--font-mono); font-weight: 700; font-size: 11px; fill: var(--text-accent); }
          .t-mono      { font-family: var(--font-mono); font-weight: 600; font-size: 10.5px; fill: var(--text-main); }
          .t-coord     { font-family: var(--font-mono); font-weight: 700; font-size: 10.5px; fill: var(--text-main); }
          .t-coord-s   { font-family: var(--font-mono); font-weight: 600; font-size: 9.5px; fill: var(--text-main); }
          .t-demux     { font-family: var(--font-mono); font-weight: 600; font-size: 9.5px; fill: var(--text-main); }
          .t-axis      { font-family: var(--font-mono); font-weight: 700; font-size: 12px; fill: var(--text-main); }
          .t-lbl       { font-family: var(--font-sans); font-weight: 700; font-size: 11.5px; fill: var(--text-main); }
          .t-leg       { font-family: var(--font-sans); font-weight: 700; font-size: 9.5px; fill: var(--text-main); }
          .t-pill-ac   { font-family: var(--font-mono); font-weight: 700; font-size: 9.5px; fill: var(--pill-ac-text); }
          .t-ant       { font-family: var(--font-sans); font-weight: 700; font-size: 10.5px; fill: var(--pill-ant-text); }
          .t-ant-m     { font-family: var(--font-mono); font-weight: 700; font-size: 10.5px; fill: var(--pill-ant-text); }
          .t-surp      { font-family: var(--font-sans); font-weight: 700; font-size: 10px; fill: var(--pill-surp-text); }
          .t-surp-m    { font-family: var(--font-mono); font-weight: 700; font-size: 10px; fill: var(--pill-surp-text); }
          .wire-a0     { fill: none; stroke: var(--a0); stroke-width: 2.2; stroke-linejoin: round; }
          .wire-am     { fill: none; stroke: var(--am); stroke-width: 3.4; stroke-linejoin: round; }
          .wire-ap     { fill: none; stroke: var(--ap); stroke-width: 4.8; stroke-linejoin: round; }
          .wire-c0     { fill: none; stroke: var(--c0); stroke-width: 2.2; stroke-linejoin: round; }
          .wire-cm     { fill: none; stroke: var(--cm); stroke-width: 3.4; stroke-linejoin: round; }
          .wire-cp     { fill: none; stroke: var(--cp); stroke-width: 4.8; stroke-linejoin: round; }
          .demux-ln    { fill: none; stroke: var(--box-stroke); stroke-width: 1.2; }
          .ray-outer   { fill: none; stroke: var(--ray-stroke); stroke-width: 1.1; stroke-dasharray: 4 3; opacity: 0.70; }
          .ray-inner   { fill: none; stroke: var(--ray-stroke); stroke-width: 1.1; stroke-dasharray: 4 3; opacity: 0.26; }
          .dot-node    { fill: var(--dot-fill); stroke: var(--dot-stroke); stroke-width: 1.8; }
          .poss-halo   { fill: var(--halo-fill); fill-opacity: 0.65; stroke: var(--halo-stroke); stroke-width: 1.3; stroke-dasharray: 3 2; }
          .poss-core   { fill: var(--dot-fill); }
          .macro-casing { fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.14; }
          .macro-line   { fill: none; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
        </style>
      </defs>

      <!-- FOND -->
      <rect width="1360" height="1085" fill="var(--bg-svg)" />

      <!-- =================================================================
           1. LES 6 CIRCUITS CONTINUS CONTRA-ROTATIFS (BOUCLES A ET C)
           ================================================================= -->
      <!-- BOUCLE D'ATTENTE (SENS ANTI-HORAIRE) -->
      <polyline class="wire-ap" points="280,232 280,490 1019,490 1019,62 615,62" />
      <polyline class="wire-am" points="335,232 335,420 923,420 923,122 615,122" />
      <polyline class="wire-a0" points="390,232 390,350 827,350 827,182 615,182" />

      <!-- BOUCLE DE CONTRÔLE (SENS HORAIRE) -->
      <polyline class="wire-cp" points="965,806 635,806 635,220 1265,220 1265,570" />
      <polyline class="wire-cm" points="965,758 731,758 731,285 1180,285 1180,570" />
      <polyline class="wire-c0" points="965,710 827,710 827,350 1095,350 1095,570" />

      <!-- =================================================================
           2. TRIANGLES DIRECTIONNELS (NEUTRE / CHARGE / DÉCHARGE)
           ================================================================= -->
      <!-- Retour vers INTERFACE SUBJECTIVE -->
      <polygon points="642,62 664,51 664,73" fill="var(--ap)" />
      <text class="t-lbl" x="674" y="53">Décharge</text>

      <polygon points="642,122 664,111 664,133" fill="var(--bg-svg)" stroke="var(--am)" stroke-width="2.5" />
      <text class="t-lbl" x="674" y="113">Charge</text>

      <polygon points="642,182 664,172 664,192" fill="var(--bg-svg)" stroke="var(--a0)" stroke-width="2.2" />
      <text class="t-lbl" x="674" y="173">Neutre</text>

      <!-- Traversée d'ANTICIPATION [0, 0, Z] -->
      <polygon points="576,350 556,340 556,360" fill="var(--bg-svg)" stroke="var(--a0)" stroke-width="2.2" />
      <polygon points="576,420 556,409 556,431" fill="var(--bg-svg)" stroke="var(--am)" stroke-width="2.5" />
      <polygon points="576,490 556,479 556,501" fill="var(--ap)" />

      <!-- Traversée de SURPRISE [0, 0, 1] -->
      <polygon points="635,556 624,576 646,576" fill="var(--cp)" />
      <polygon points="731,556 720,576 742,576" fill="var(--bg-svg)" stroke="var(--cm)" stroke-width="2.5" />
      <polygon points="827,556 817,576 837,576" fill="var(--bg-svg)" stroke="var(--c0)" stroke-width="2.2" />

      <!-- Retour vers INTERFACE PERCEPTIVE -->
      <text class="t-lbl" x="1095" y="520" text-anchor="middle">Neutre</text>
      <polygon points="1095,556 1084,536 1106,536" fill="var(--bg-svg)" stroke="var(--c0)" stroke-width="2.2" />

      <text class="t-lbl" x="1180" y="520" text-anchor="middle">Charge</text>
      <polygon points="1180,556 1169,536 1191,536" fill="var(--bg-svg)" stroke="var(--cm)" stroke-width="2.5" />

      <text class="t-lbl" x="1265" y="520" text-anchor="middle">Décharge</text>
      <polygon points="1265,556 1254,536 1276,536" fill="var(--cp)" />

      <!-- =================================================================
           3. DÉMULTIPLEXAGE DES 9 ENTRÉES PAR INTERFACE CACHÉE & AXES
           ================================================================= -->
      <!-- 9 entrées côté droit INTERFACE SUBJECTIVE -->
      <path class="demux-ln" d="M615,62 L598,46 L520,46 M615,62 L520,62 M615,62 L598,78 L520,78" />
      <rect x="532" y="39" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="49" text-anchor="middle">A+/C+</text>
      <rect x="532" y="55" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="65" text-anchor="middle">A+/C-</text>
      <rect x="532" y="71" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="81" text-anchor="middle">A+/C0</text>

      <path class="demux-ln" d="M615,122 L598,106 L520,106 M615,122 L520,122 M615,122 L598,138 L520,138" />
      <rect x="532" y="99" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="109" text-anchor="middle">A-/C+</text>
      <rect x="532" y="115" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="125" text-anchor="middle">A-/C-</text>
      <rect x="532" y="131" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="141" text-anchor="middle">A-/C0</text>

      <path class="demux-ln" d="M615,182 L598,166 L520,166 M615,182 L520,182 M615,182 L598,198 L520,198" />
      <rect x="532" y="159" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="169" text-anchor="middle">A0/C+</text>
      <rect x="532" y="175" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="185" text-anchor="middle">A0/C-</text>
      <rect x="532" y="191" width="54" height="14" rx="3" fill="var(--bg-svg)" />
      <text class="t-demux" x="559" y="201" text-anchor="middle">A0/C0</text>

      <!-- 9 entrées côté haut INTERFACE PERCEPTIVE -->
      <path class="demux-ln" d="M1095,570 L1081,584 L1081,655 M1095,570 L1095,655 M1095,570 L1109,584 L1109,655" />
      <rect x="1066" y="588" width="58" height="50" rx="4" fill="var(--bg-svg)" />
      <text class="t-demux" x="1095" y="601" text-anchor="middle">C0/A+</text>
      <text class="t-demux" x="1095" y="616" text-anchor="middle">C0/A-</text>
      <text class="t-demux" x="1095" y="631" text-anchor="middle">C0/A0</text>

      <path class="demux-ln" d="M1180,570 L1166,584 L1166,655 M1180,570 L1180,655 M1180,570 L1194,584 L1194,655" />
      <rect x="1151" y="588" width="58" height="50" rx="4" fill="var(--bg-svg)" />
      <text class="t-demux" x="1180" y="601" text-anchor="middle">C-/A+</text>
      <text class="t-demux" x="1180" y="616" text-anchor="middle">C-/A-</text>
      <text class="t-demux" x="1180" y="631" text-anchor="middle">C-/A0</text>

      <path class="demux-ln" d="M1265,570 L1251,584 L1251,655 M1265,570 L1265,655 M1265,570 L1279,584 L1279,655" />
      <rect x="1236" y="588" width="58" height="50" rx="4" fill="var(--bg-svg)" />
      <text class="t-demux" x="1265" y="601" text-anchor="middle">C+/A+</text>
      <text class="t-demux" x="1265" y="616" text-anchor="middle">C+/A-</text>
      <text class="t-demux" x="1265" y="631" text-anchor="middle">C+/A0</text>

      <!-- Étiquettes d'axes -->
      <text class="t-axis" x="288" y="252">+X</text>
      <text class="t-axis" x="343" y="252">-X</text>
      <text class="t-axis" x="398" y="252">0</text>

      <text class="t-axis" x="954" y="704" text-anchor="end">0</text>
      <text class="t-axis" x="954" y="752" text-anchor="end">-Y</text>
      <text class="t-axis" x="954" y="800" text-anchor="end">+Y</text>
      <text class="t-lbl" x="800" y="828" text-anchor="middle">Signaux efférents (copie d'efférence)</text>

      <!-- =================================================================
           4. LES 9 RAYONS POINTILLÉS (COUCHE EXTERNE, SOUS LES BADGES)
           ================================================================= -->
      <g id="rays-outer-layer">
        <line class="ray-outer" x1="635" y1="350" x2="152" y2="598" />
        <line class="ray-outer" x1="731" y1="350" x2="287.5" y2="598" />
        <line class="ray-outer" x1="827" y1="350" x2="423" y2="598" />
        <line class="ray-outer" x1="635" y1="420" x2="152" y2="646" />
        <line class="ray-outer" x1="731" y1="420" x2="287.5" y2="646" />
        <line class="ray-outer" x1="827" y1="420" x2="423" y2="646" />
        <line class="ray-outer" x1="635" y1="490" x2="152" y2="694" />
        <line class="ray-outer" x1="731" y1="490" x2="287.5" y2="694" />
        <line class="ray-outer" x1="827" y1="490" x2="423" y2="694" />
      </g>

      <!-- =================================================================
           5. BADGES ANTICIPATION & SURPRISE (Z-ORDER AU-DESSUS DES RAYONS)
           ================================================================= -->
      <g>
        <rect x="412" y="434" width="126" height="42" rx="7"
              fill="var(--pill-ant-fill)" stroke="var(--pill-ant-stroke)" stroke-width="1.6" />
        <text class="t-ant" x="475" y="451" text-anchor="middle">ANTICIPATION</text>
        <text class="t-ant-m" x="475" y="467" text-anchor="middle">[0, 0, Z]</text>

        <rect x="641" y="605" width="84" height="42" rx="7"
              fill="var(--pill-surp-fill)" stroke="var(--pill-surp-stroke)" stroke-width="1.6" />
        <text class="t-surp" x="683" y="622" text-anchor="middle">SURPRISE</text>
        <text class="t-surp-m" x="683" y="638" text-anchor="middle">[0, 0, 1]</text>
      </g>

      <!-- =================================================================
           6. CROISEMENT I : BASE PROJECTIVE DIRECTIONNELLE (X, Y, 0) & VEILLE
           ================================================================= -->
      <g>
        <circle class="dot-node" cx="635" cy="350" r="6" />
        <text class="t-coord" x="644" y="368">(0,2,0)</text>

        <circle class="dot-node" cx="731" cy="350" r="6" />
        <text class="t-coord" x="740" y="368">(0,-2,0)</text>

        <!-- Veille (0,0,0) située EXCLUSIVEMENT au Croisement I -->
        <circle cx="827" cy="350" r="9.5" fill="none" stroke="var(--text-accent)" stroke-width="2" />
        <circle class="dot-node" cx="827" cy="350" r="6" />
        <text class="t-coord" x="838" y="367">Veille</text>
        <text class="t-coord" x="838" y="380">(0,0,0)</text>

        <circle class="dot-node" cx="635" cy="420" r="6" />
        <text class="t-coord" x="644" y="438">(-1,1,0)</text>

        <circle class="dot-node" cx="731" cy="420" r="6" />
        <text class="t-coord" x="740" y="438">(-1,-1,0)</text>

        <circle class="dot-node" cx="827" cy="420" r="6" />
        <text class="t-coord" x="838" y="438">(-2,0,0)</text>

        <circle class="dot-node" cx="635" cy="490" r="6" />
        <text class="t-coord" x="644" y="508">(1,1,0)</text>

        <circle class="dot-node" cx="731" cy="490" r="6" />
        <text class="t-coord" x="740" y="508">(1,-1,0)</text>

        <circle class="dot-node" cx="827" cy="490" r="6" />
        <text class="t-coord" x="838" y="508">(2,0,0)</text>
      </g>

      <!-- =================================================================
           7. CROISEMENT II : GRILLE COMBINATOIRE EXTERNE [A / C]
           ================================================================= -->
      <g>
        <circle class="dot-node" cx="827" cy="220" r="5.5" />
        <rect x="795" y="191" width="64" height="20" rx="4" fill="var(--pill-ac-fill)" />
        <text class="t-pill-ac" x="827" y="204" text-anchor="middle">[A0/C+]</text>

        <circle class="dot-node" cx="923" cy="220" r="5.5" />
        <rect x="891" y="191" width="64" height="20" rx="4" fill="var(--pill-ac-fill)" />
        <text class="t-pill-ac" x="923" y="204" text-anchor="middle">[A-/C+]</text>

        <circle class="dot-node" cx="1019" cy="220" r="5.5" />
        <rect x="987" y="191" width="64" height="20" rx="4" fill="var(--pill-ac-fill)" />
        <text class="t-pill-ac" x="1019" y="204" text-anchor="middle">[A+/C+]</text>

  <script>
    function setTheme(themeClass) {
      document.body.className = themeClass;
    }

    function exportSVG() {
      const svg = document.getElementById("moteur-svg");
      const styles = getComputedStyle(document.body);
      let svgText = new XMLSerializer().serializeToString(svg);
      svgText = svgText.replace(/var\((--[a-zA-Z0-9_-]+)\)/g, (_, varName) => {
        return styles.getPropertyValue(varName).trim();
      });

      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `moteur_predictif_${document.body.className}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
