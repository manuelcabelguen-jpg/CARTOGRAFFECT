[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograffect-sim"
version = "2.1.0"
description = "Modèle génératif probabiliste inversible (POMDP hiérarchique sous inférence active) traduisant l'architecture formelle CARTOGRAFFECT® pour validation empirique in silico."
readme = "README.md"
license = {text = "AGPL-3.0-or-later AND CC-BY-NC-SA-4.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "jax",
    "equinox",
    "inferactively-pymdp",
    "numpyro",
    "arviz",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT"
Repository = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT"
Documentation = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT/blob/main/NOTICE"
OSF = "https://osf.io/z89sg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

