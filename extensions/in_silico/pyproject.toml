[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograffect-sim"
version = "3.0.0"
description = "Modèle génératif probabiliste inversible (POMDP hiérarchique sous inférence active) traduisant l'architecture formelle CARTOGRAFFECT pour tests de cohérence in silico."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "jax==0.12.0.1",
    "equinox==0.13.8",
    "inferactively-pymdp==1.0.5",
    "numpyro==0.22.0",
    "arviz==1.3.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]
test = [
    "pytest==9.2.0",
]

[project.urls]
Homepage = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT"
Repository = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT"
Documentation = "https://github.com/manuelcabelguen-jpg/CARTOGRAFFECT/blob/main/NOTICE"
OSF = "https://osf.io/z89sg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
