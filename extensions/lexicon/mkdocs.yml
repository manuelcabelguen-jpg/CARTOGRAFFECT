site_name: CARTOGRAFFECT — Documentation Scientifique & Lexique (Strate 1)
site_description: Architecture géométrique 3D CARTOGRAFFECT, lexique affectif français (NRC-VAD + DIMA + FANCat) et épreuve externe par les roues des émotions (Scherer et al., 2013)
site_author: Manuel Cabelguen
copyright: "Code : GNU AGPLv3 (AGPL-3.0-or-later) | Documentation & Tables : CC BY 4.0 (CC-BY-4.0) — Copyright © 2026 Manuel Cabelguen"

theme:
  name: material
  language: fr
  palette:
    - scheme: slate
      primary: indigo
      accent: teal

nav:
  - Accueil: index.md
  - Défi des Roues des Émotions: validation_roues_emotions_scherer.md

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - toc:
      permalink: true

