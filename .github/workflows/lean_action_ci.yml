name: Lean 4 Formal Verification CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Lean 4 Action (lake build & axiom audit)
        uses: leanprover/lean-action@v1
        with:
          auto-config: true
