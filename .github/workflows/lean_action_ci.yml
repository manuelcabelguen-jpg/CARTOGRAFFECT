name: Lean 4 Formal Verification CI

on:
  push:
    branches: ["main", "v3.0.0-dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Lean 4 Action (lake build & axiom audit)
        uses: leanprover/lean-action@v1
        with:
          auto-config: true

      - name: Execute exhaustive axiom audit (Cartograffect/AuditTests.lean)
        run: lake env lean Cartograffect/AuditTests.lean
