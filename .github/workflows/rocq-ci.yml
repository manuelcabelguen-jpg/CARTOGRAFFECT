name: "[LEGACY v2.1 — ARCHIVED] Rocq Formal Verification CI"

on:
  workflow_dispatch:

jobs:
  verify-rocq:
    runs-on: ubuntu-latest
    container:
      image: rocq/rocq-prover:9.0
      options: --user root

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Audit statique (0 Admitted / 0 Axiom)
        working-directory: ./rocq
        run: |
          if grep -rnE "\b(Admitted|give_up|Axiom|Parameter|Conjecture)\b" theories/; then
            echo "ERREUR : Preuve incomplète ou axiome non autorisé détecté !"
            exit 1
          fi
          echo "Audit statique réussi : 0 Admitted, 0 Axiom."

      - name: Compilation stricte et exécution de AuditTests.v
        working-directory: ./rocq
        run: |
          ROCQ_BIN=$(dirname "$(find /home /root /opt /usr -name rocq -type f 2>/dev/null | head -n 1)")
          export PATH="$ROCQ_BIN:$PATH"
          rocq makefile -f _CoqProject -o Makefile
          make -j$(nproc)
