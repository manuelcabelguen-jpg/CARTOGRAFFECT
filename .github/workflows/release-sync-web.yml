name: Release Sync Web (Strate 2 Payload)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dispatch_web:
        description: "Envoyer repository_dispatch vers manuelcabelguen-jpg/manuelcabelguen-jpg.github.io"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  export-and-dispatch:
    name: Export site-payload.json & Dispatch Web Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run blocking consistency guardrails (--strict)
        run: python scripts/check_consistency.py --strict

      - name: Export and verify deterministic site-payload.json
        run: |
          python scripts/export_site_payload.py --output site-payload.json
          python scripts/export_site_payload.py --check --output site-payload.json

      - name: Upload site-payload.json workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-payload
          path: site-payload.json

      - name: Attach site-payload.json to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" site-payload.json --clobber

      - name: Extract release metadata for dispatch
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_URL: ${{ github.event.release.html_url }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os

          with open("site-payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          version = payload["release"]["version"]
          tag = os.environ.get("EVENT_TAG") or payload["release"]["tag"]
          repo_slug = os.environ["REPO_SLUG"]
          release_url = (
              os.environ.get("EVENT_RELEASE_URL")
              or payload["identifiers"]["github_release_url"]
          )
          payload_url = (
              f"https://github.com/{repo_slug}/releases/download/{tag}/site-payload.json"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
              out.write(f"release_url={release_url}\n")
              out.write(f"payload_url={payload_url}\n")
          PY

      - name: Send repository_dispatch (compendium-release) to website repository
        if: github.event_name != 'workflow_dispatch' || inputs.dispatch_web != false
        env:
          WEB_SYNC_TOKEN: ${{ secrets.WEB_SYNC_TOKEN }}
          SYNC_VERSION: ${{ steps.meta.outputs.version }}
          SYNC_TAG: ${{ steps.meta.outputs.tag }}
          SYNC_RELEASE_URL: ${{ steps.meta.outputs.release_url }}
          SYNC_PAYLOAD_URL: ${{ steps.meta.outputs.payload_url }}
        run: |
          if [ -z "${WEB_SYNC_TOKEN:-}" ]; then
            echo "::notice::WEB_SYNC_TOKEN n'est pas configuré — repository_dispatch vers manuelcabelguen-jpg/manuelcabelguen-jpg.github.io ignoré gracieusement."
            exit 0
          fi

          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "event_type": "compendium-release",
              "client_payload": {
                  "version": os.environ["SYNC_VERSION"],
                  "tag": os.environ["SYNC_TAG"],
                  "release_url": os.environ["SYNC_RELEASE_URL"],
                  "payload_url": os.environ["SYNC_PAYLOAD_URL"],
              },
          }))
          PY
          )

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEB_SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/manuelcabelguen-jpg/manuelcabelguen-jpg.github.io/dispatches" \
            -d "${BODY}"
